# Prometheus 3.x as an OTLP/HTTP metrics store (fed by the hub, D18).
# No scrape jobs for the sites: the pipeline is push-only, and a scrape job pointed at a
# simulator would be exactly the anti-pattern D18 forbids. Prometheus scrapes only itself.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
