# HMI server. Static files, plus one reverse proxy so the page has a single origin.
#
# Everything the page needs is either a file in this directory or a PromQL query. Nothing
# is scraped from a simulator and no vendor agent is involved (D15, D18): the query side
# is Prometheus, which is fed over OTLP by the hub one hop downstream of the impaired link.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Strip the /prom prefix and hand the query to Prometheus. The browser therefore never
    # needs CORS and Prometheus is never exposed to the host.
    location /prom/ {
        proxy_pass http://prometheus:9090/;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }

    location = /healthz {
        return 200 "ok\n";
    }

    # The page is data, not an app bundle: no build step, no hashed asset names.
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
