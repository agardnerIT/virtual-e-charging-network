# energy.* semantic conventions for this repo (Weaver registry).
#
# Authored, not generated: the first draft was produced from collector/edge/site.yaml so that
# names, units and descriptions could not be mistyped, and `make registry-check` now keeps the
# two in step in BOTH directions — a metric the edge emits and this file omits is a failing
# build, and so is a metric here that nothing emits.
#
# Naming decision (D44): one public prefix, groups inside it that map onto the SIG boundaries
# a split would use.

groups:
  - id: registry.energy.attributes
    type: attribute_group
    brief: The bounded attributes every energy signal can carry.
    stability: development
    attributes:
      - id: energy.site.id
        type: string
        brief: "Stable site identifier. Stamped by the edge collector."
        stability: development
        examples: [rural-brokenhill, metro-tottenham, microgrid-kangaroo-island]
      - id: energy.site.name
        type: string
        brief: "Human-readable site name."
        stability: development
        examples: [Broken Hill EV Charging Site]
      - id: energy.site.kind
        type: string
        brief: "Regime, not size: charging site, solar farm, wind farm or microgrid."
        stability: development
        examples: [charging_site, solar_farm, wind_farm, microgrid]
      - id: geo.latitude
        type: double
        brief: "Site latitude (WGS84)."
        stability: development
      - id: geo.longitude
        type: double
        brief: "Site longitude (WGS84)."
        stability: development
      - id: otel.data_point.quality
        type: string
        brief: "Validity of a data point that is present. good/stale/bad/comms-lost. Authored by the edge collector."
        stability: development
        examples: [good, stale, bad, comms-lost]
      - id: energy.phase
        type: string
        brief: "Phase, in IEC naming. The device says A/B/C; the edge collector translates."
        stability: development
        examples: [L1, L2, L3]
      - id: energy.direction
        type: string
        brief: "Energy direction for a cumulative register."
        stability: development
        examples: [import, export]
      - id: energy.evse.id
        type: string
        brief: "Billing-grade bay identifier from OCPP."
        stability: development
        examples: [EVSE01, EVSE12]
      - id: energy.connector.id
        type: int
        brief: "OCPP 1.6 connector number (1-based)."
        stability: development
      - id: energy.evse.state.text
        type: string
        brief: "Readable OCPP charge-point status, written by the edge collector."
        stability: development
        examples: [Available, Charging]
      - id: ocpp.transaction.id
        type: int
        brief: "OCPP 1.6 transaction id, allocated by the CSMS."
        stability: development
      - id: energy.session.id
        type: string
        brief: "Session span identity. Unbounded by design: one per session."
        stability: development
        examples: [9f2c1a4b7d3e]
      - id: energy.mppt
        type: int
        brief: "MPPT tracker block index (SunSpec model 160)."
        stability: development
        examples: [1, 2]
      - id: energy.turbine
        type: int
        brief: "Turbine index within a wind farm (repeating vendor model)."
        stability: development
        examples: [1, 2, 3]
      - id: energy.irradiance.plane
        type: string
        brief: "Which plane an irradiance reading is in."
        stability: development
        examples: [horizontal, plane_of_array]
      - id: energy.source.name
        type: string
        brief: "Which generating source block a reading belongs to."
        stability: development
        examples: [solar, wind]
      - id: energy.point
        type: string
        brief: "The device-side point name, for provenance back to the register map."
        stability: development
        examples: [VphA, W]
      - id: modbus.register.address
        type: int
        brief: "Absolute Modbus register address."
        stability: development
      - id: modbus.register.scale_factor
        type: int
        brief: "The device scale factor applied (value = raw x 10^sf)."
        stability: development
      - id: energy.device.timestamp
        type: double
        brief: "The device clock at the moment of the reading. Provenance; never a sort key (D42)."
        stability: development
      - id: energy.receive.timestamp
        type: double
        brief: "When the collector saw the value. The only comparable clock."
        stability: development
      - id: energy.bess.status.text
        type: string
        brief: "Readable battery state."
        stability: development
        examples: [idle, charging, discharging, hold]
      - id: energy.bess.hold_reason.text
        type: string
        brief: "Why the grid former stopped doing what the busbar asked."
        stability: development
        examples: [none, soc-high, soc-low, power-limit]
      - id: energy.inverter.status.text
        type: string
        brief: "Readable inverter operating state."
        stability: development
        examples: [off, sleeping, mppt, fault]
      - id: energy.curtailment.text
        type: string
        brief: "Why generation is held down."
        stability: development
        examples: [none, export_limited, inverter_clipped, connection_cap]
      - id: energy.fault_code.text
        type: string
        brief: "Readable device fault code."
        stability: development
        examples: [none]
      - id: energy.turbine.status.text
        type: string
        brief: "Readable turbine state."
        stability: development
        examples: [idle, starting, producing, curtailed, fault]
      - id: energy.windfarm.status.text
        type: string
        brief: "Readable farm state."
        stability: development
        examples: [idle, producing]
      - id: energy.microgrid.grid_forming_source
        type: string
        brief: "Which asset sets the voltage and frequency on an island."
        stability: development
        examples: [bess]
      - id: ocpp.stop.reason
        type: string
        brief: "OCPP 1.6 StopTransaction reason."
        stability: development
        examples: [Local, PowerLoss, Other]
