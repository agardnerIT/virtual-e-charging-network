# M0 — the collector topology, proved, with no domain code at all (plan.md §9).
#
#   meter sim (Modbus TCP) <--poll-- poller   <- the rural site's real device path (M1a)
#   inverter sim (Modbus TCP) <--poll-- poller <- the solar farm's real device path (M1b)
#   turbine-farm sim (Modbus TCP) <--poll-- poller <- the wind farm's real device path (M1b)
#        |
#        v
#   edge collector   (one per site)           <- OT zone boundary, disk-backed queue
#        |
#        v   OTLP/gRPC, over the impaired link
#   toxiproxy        (the WAN)                <- latency / loss / bandwidth / outage
#        |
#        v
#   hub collector    (one)                    <- NOC / IT zone
#        |
#        v   OTLP, shed of per-sample attributes on the visual path
#   prometheus + jaeger                        <- the local visual stack (D3)
#        |
#        v   PromQL over the same origin (nginx /prom)
#   hmi                                        <- map of Australia + one-line mimic (D18)
#
# Both generation sites are real now: the solar farm runs a SunSpec/Modbus inverter and the wind
# farm a six-turbine SunSpec-shaped device, both behind the same poller and the same image as the
# rural meter (M1b part 2).
#
# Four sites (M3-1): the rural charging site, the two generation sites, and a metro depot whose
# twelve bays run overlapping sessions on one charge point over a good fibre link. The depot is the
# same image, the same poller and the same edge config as the rural site - it differs by scale and
# by environment, which is the whole claim (D10,D37).
#
# Three sites, so that fan-in is visible from the first command.

name: otel-ot

x-collector: &collector
  # NB: pin deliberately. 0.116.0's arm64 image is published empty and fails with
  # "exec /otelcol-contrib: no such file or directory" — checked, not assumed (D10).
  image: otel/opentelemetry-collector-contrib:0.130.0
  restart: unless-stopped
  command: ["--config=/etc/otel/config.yaml"]

# One image, two roles: the Modbus device simulator and the Modbus -> OTLP poller. Shared
# sunspec.py keeps the register encoder and decoder in step. Parameterised by environment
# only (D10).
x-sim: &sim
  build:
    context: ../sim
  restart: unless-stopped

x-generator: &generator
  image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest
  restart: unless-stopped
  profiles: [generator]   # unused by default; kept so an OTLP-only smoke test is one flag away

networks:
  ot-rural: {}   # site 3, OT zone
  ot-solar: {}   # solar farm, OT zone
  ot-wind: {}    # wind farm, OT zone
  ot-metro: {}   # metro depot, OT zone
  ot-microgrid: {}  # isolated microgrid, OT zone (M3-2)
  ot-highway: {}    # highway service centre, OT zone (M4)
  wan: {}        # the impaired link between site and NOC
  noc: {}        # NOC / IT zone

volumes:
  edge-rural-queue: {}
  edge-solar-queue: {}
  edge-wind-queue: {}
  edge-metro-queue: {}
  edge-microgrid-queue: {}
  edge-highway-queue: {}
  prometheus-data: {}
  loki-data: {}

services:

  # ---- the WAN -------------------------------------------------------------------
  # One container, two proxies: each site gets its own link so it can be degraded
  # independently. `make link SITE=... PROFILE=...` drives these (plan.md §5.4).
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.11.0
    restart: unless-stopped
    command: ["-host=0.0.0.0", "-config", "/config/toxiproxy.json"]
    volumes:
      - ../impairment/toxiproxy.json:/config/toxiproxy.json:ro
    ports:
      - "8474:8474"   # toxiproxy control API
    networks: [wan]

  # ---- NOC / IT zone -------------------------------------------------------------
  hub:
    <<: *collector
    environment:
      # The hub fans out to the local visual stack (D3, D18) - and this is the *only*
      # place a backend endpoint appears. Swapping the local stack for a real backend, or
      # adding a second one, is a change to these two lines and nothing else (D2, D15).
      # Neither endpoint receives anything scraped from a simulator: this is the pipeline's
      # own output, one hop downstream of the impaired link.
      # Per-phase cardinality control (M4, #11): `keep` (default) sends every per-phase data
      # point to the visual store, `drop` sends only the aggregate. The backend-of-record
      # pipeline is untouched either way.  make up VISUAL_PHASES=drop
      VISUAL_PHASES: "${VISUAL_PHASES:-keep}"
      VISUAL_METRICS_ENDPOINT: "http://prometheus:9090/api/v1/otlp"
      VISUAL_TRACES_ENDPOINT: "jaeger:4317"
    volumes:
      - ../collector/hub/hub.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP/gRPC - point any backend or CLI at this
      - "4318:4318"   # OTLP/HTTP
      - "8889:8889"   # hub self-telemetry (Prometheus)
    networks: [wan, noc]

  # Not part of the story: an ops box used by `make queues` to read the edge
  # collectors' own metrics. The collectors are distroless, so there is no shell
  # to exec into; reading their self-telemetry is the OTel-native way anyway.
  ops:
    image: alpine:3.20
    entrypoint: ["sh", "-c", "sleep infinity"]
    networks: [wan, noc]

  # ---- the local visual stack (D3, D18) -------------------------------------------
  #
  # Prometheus 3 and Jaeger v2, both fed over OTLP by the hub and by nothing else. Chosen
  # over Grafana OSS on measured RAM and on the shape of the one-line mimic (plan.md D24):
  # Grafana cost 123 MiB to Perses' 23, and neither draws an SVG mimic with values in
  # place, which is the thing the domain reader actually asks for. So the views are ours
  # (hmi/) and they read the store; Perses stays available as an optional profile for
  # anyone who wants a familiar dashboard, and nothing depends on it.
  #
  # Note Jaeger v2 is itself an OpenTelemetry Collector distribution - so even the trace
  # store is a collector, and no vendor agent enters the estate (D15).
  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 6h is a proof-of-life retention (D3), not a historian. The edge queues, not this
      # disk, are the store-and-forward story.
      - --storage.tsdb.retention.time=6h
      - --web.enable-otlp-receiver
    volumes:
      - ../dashboards/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # Deliberately publishes no host port. Port 9090 is already held on this machine by an
    # unrelated ssh port-forward, and a silently-unbound Docker mapping is exactly the trap
    # docs/findings.md #32 records for 8888. `make prom Q='...'` queries it through the ops box on the
    # compose network instead - the same OTel-native habit as `make queues`.
    networks: [noc]

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.19.0
    restart: unless-stopped
    # The v2 image ships no config at all (distroless, binary at /cmd/jaeger/jaeger-linux).
    command: ["--config", "/etc/jaeger/config.yaml"]
    volumes:
      - ../dashboards/jaeger/jaeger.yaml:/etc/jaeger/config.yaml:ro
    # 16686 is also taken on this machine (the same ssh port-forward), so the UI is on an
    # overridable free port.  JAEGER_PORT=16686 make up  if your machine is clear.
    ports:
      - "127.0.0.1:${JAEGER_PORT:-16687}:16686"
    networks: [noc]

  # Our own views: a map of Australia and a one-line mimic per site (D18). Static files,
  # no build step, no framework. nginx serves them and reverse-proxies /prom/ to
  # Prometheus, so the page has one origin, needs no CORS dance, and the browser never
  # talks to the metrics store directly.
  hmi:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ../hmi:/usr/share/nginx/html:ro
      - ../hmi/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # Loopback only, and on an overridable port: 8090 is held here by the ssh port-forward
    # noted above.  HMI_PORT=8090 make up  on a machine where 8090 is free.
    ports:
      - "127.0.0.1:${HMI_PORT:-8091}:80"   # this is the proof of life: `make up` ends here
    depends_on: [prometheus]
    networks: [noc]

  # Optional log store (D45). Nothing in the default stack depends on it: `make up` does not
  # start it and the hub does not export to it. Started on request so the cost of the choice can
  # be measured rather than argued about:
  #   docker compose -f compose/docker-compose.yml --profile loki up -d loki
  # The hub-side recipe (exporter + pipeline) is a comment in collector/hub/hub.yaml.
  loki:
    profiles: [loki]
    image: grafana/loki:3.3.2
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ../dashboards/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"   # loopback only, like the other UIs
    networks: [noc]

  # Optional, and nothing depends on it (plan.md D24). Deliberately not started by
  # `make up`; `make up STACK=perses` brings it in. 23 MiB, dashboards as YAML.
  perses:
    profiles: [perses]
    image: persesdev/perses:v0.50.0
    restart: unless-stopped
    command: ["--config", "/etc/perses/config.yaml"]
    volumes:
      # Mount the config file and the provisioning folder, NOT /etc/perses as a whole:
      # the image keeps its CUE panel/query schemas there and shadowing them is fatal.
      - ../dashboards/perses/config.yaml:/etc/perses/config.yaml:ro
      - ../dashboards/perses/provisioning:/etc/perses/provisioning:ro
    ports:
      - "127.0.0.1:8080:8080"
    networks: [noc]

  # ---- site 3: weak rural end of line (OT zone) ----------------------------------
  edge-rural:
    <<: *collector
    user: "0:0"   # image runs as 10001, but the disk-backed queue is a root-owned volume
    environment:
      SITE_ID: rural-brokenhill
      SITE_NAME: Broken Hill EV Charging Site
      SITE_KIND: charging_site
      SITE_LAT: "-31.9539"
      SITE_LON: "141.4539"
      HUB_ENDPOINT: toxiproxy:14317
    volumes:
      - ../collector/edge/site.yaml:/etc/otel/config.yaml:ro
      - edge-rural-queue:/var/lib/otelcol/queue
    # Deliberately no host ports: nothing inside the OT zone is reachable from outside.
    depends_on: [toxiproxy]
    networks: [ot-rural, wan]

  # ---- site 3: the Modbus/SunSpec meter and its poller (OT zone) ------------------
  # The device-facing half of M1a. The meter speaks Modbus TCP and nothing else; the poller
  # reads it and forwards OTLP to the edge collector. Neither publishes a host port, so the
  # OT zone stays unreachable from outside - which is also why `make fault` execs into the
  # device container rather than curling it from the host.
  device-rural:
    <<: *sim
    command: ["python", "site/site.py"]
    environment:
      DEVICE_ID: meter-rural-01
      DEVICE_MODEL: VECN SIM-METER-3P-WYE
      MODBUS_PORT: "5020"
      HTTP_PORT: "8080"
      # No NTP at a site like this (plan.md 5.5), so the device clock is deliberately 7 s
      # behind. That is the whole point of the dual-timestamp story.
      DEVICE_CLOCK_SKEW_S: "-7"
      NOMINAL_VOLTAGE: "230"
      ENERGY_BASE_KWH: "42917.3"
      # Vendor word order for the 32-bit energy accumulators. "low" reproduces the reversed
      # order that a naive (reg0 << 16) | reg1 decode gets catastrophically wrong.
      WORD_ORDER: low
    networks: [ot-rural]

  poller-rural:
    <<: *sim
    command: ["python", "poller/poller.py"]
    environment:
      DEVICE_ID: meter-rural-01
      DEVICE_MODEL: VECN SIM-METER-3P-WYE
      MODBUS_HOST: device-rural
      MODBUS_PORT: "5020"
      MODBUS_UNIT_ID: "1"
      OTLP_ENDPOINT: "http://edge-rural:4318"
      POLL_INTERVAL_MS: "1000"
      # The scan is 1 Hz; the report to the edge is every 5 s. Keep these distinct. Tying the
      # OTLP export interval to the poll interval made the poller open a gRPC export per
      # second - 1 106 metric points a minute crossing a link whose whole story is that it is
      # a 4G backhaul - and it is the deadband's opposite: a steady register is not worth a
      # message. This value is also the pipeline's time resolution on the diagram.
      OTEL_METRIC_EXPORT_INTERVAL_MS: "5000"
      NOMINAL_VOLTAGE: "230"
    depends_on: [device-rural, edge-rural]
    networks: [ot-rural]

  # ---- M2: the OCPP pair, both in the rural OT zone --------------------------------
  # A charging session is a trace. The charge point is the only process here that is both
  # an OCPP client and a Modbus client: it reads supply voltage from device-rural and
  # reports what it did about a sag over OCPP, so sag -> derate -> failed session is one
  # injection and a real reaction, not authored causality.
  #
  # The CSMS is a protocol-real test double, not SteVe + MySQL: D10's 3 GB budget and
  # plan.md §8 rule out a JVM and a database as the default. It speaks real OCPP 1.6J
  # (WebSocket, subprotocol ocpp1.6, real transactions) and keeps them in memory.
  csms:
    <<: *sim
    command: ["python", "ocpp/csms.py"]
    environment:
      CSMS_PORT: "9000"
      HTTP_PORT: "9001"
      CSMS_ID: csms-rural-01
      OTLP_ENDPOINT: "http://edge-rural:4318"
      CSMS_BLOCKED_ID_TAGS: "BLOCKED-0000"
      CSMS_HEARTBEAT_INTERVAL_S: "60"
    depends_on: [edge-rural]
    networks: [ot-rural]

  ocpp-cp:
    <<: *sim
    command: ["python", "ocpp/cp.py"]
    environment:
      CP_ID: EVSE-RURAL-01
      CP_MODEL: VECN SIM-AC22
      CP_EVSE_COUNT: "2"
      CSMS_URL: "ws://csms:9000/ocpp/EVSE-RURAL-01"
      HTTP_PORT: "8080"
      # The supply-voltage input: the same site meter and the same shared register map as
      # the poller. No second fault-injection point (M2-4).
      SUPPLY_MODBUS_HOST: device-rural
      SUPPLY_MODBUS_PORT: "5020"
      SUPPLY_MODBUS_UNIT_ID: "1"
      SUPPLY_POLL_INTERVAL_MS: "1000"
      OTLP_ENDPOINT: "http://edge-rural:4318"
      OTEL_METRIC_EXPORT_INTERVAL_MS: "5000"
      # Expo defaults: one live session on EVSE01, restarted after a gap so the demo
      # repeats; 10 s MeterValues is the OCPP clock a CSMS actually configures.
      CP_AUTO_EVSE: EVSE01
      CP_SESSION_DURATION_S: "600"
      CP_IDLE_GAP_S: "20"
      CP_METER_INTERVAL_S: "10"
    depends_on: [device-rural, csms, edge-rural]
    # No host port: the OT zone stays unreachable from outside, so `make session` and
    # `make spine` exec in, exactly like `make fault` does for the device.
    networks: [ot-rural]

  # ---- the market: a recorded price feed, not a device (M4, #22) -------------------
  # The one signal in this stack that is not a measurement of anything physical. It replays
  # docs/measurements/market-prices-nsw1.csv (288 five-minute intervals, with a midday negative
  # price) in phase with the wall clock, and emits to the rural site's edge collector so that a
  # price arrives with the same site identity the cost query joins on.
  #
  # Deliberately offline: no API key, no network dependency, and `make up` works on a plane.
  # docs/standards.md §5 says a market price is not a device measurement and must not be dressed
  # as one; `energy.market.price.feed_age` is the metric that tells you it is a recording.
  market:
    <<: *sim
    command: ["python", "market/feed.py"]
    environment:
      MARKET_REGION: "NSW1"
      MARKET_PRICE_FILE: "/app/market-prices-nsw1.csv"
      OTLP_ENDPOINT: "http://edge-rural:4318"
      OTEL_METRIC_EXPORT_INTERVAL_MS: "5000"
    volumes:
      - ../docs/measurements/market-prices-nsw1.csv:/app/market-prices-nsw1.csv:ro
    depends_on: [edge-rural]
    networks: [ot-rural]

  # ---- solar farm: utility-scale generation (OT zone) ----------------------------
  edge-solar:
    <<: *collector
    user: "0:0"   # image runs as 10001, but the disk-backed queue is a root-owned volume
    environment:
      SITE_ID: solar-mildura
      SITE_NAME: Mildura Solar Farm
      SITE_KIND: solar_farm
      SITE_LAT: "-34.1850"
      SITE_LON: "142.1620"
      HUB_ENDPOINT: toxiproxy:14318
    volumes:
      - ../collector/edge/site.yaml:/etc/otel/config.yaml:ro
      - edge-solar-queue:/var/lib/otelcol/queue
    # Deliberately no host ports: nothing inside the OT zone is reachable from outside.
    depends_on: [toxiproxy]
    networks: [ot-solar, wan]

  # ---- solar farm: the SunSpec/Modbus inverter and its poller (OT zone) -----------
  # Same image and same poller as the rural meter; only DEVICE_KIND and the electrical
  # ratings differ (D10). The register file is the M1b inverter map: model 103 (three-phase
  # inverter), model 160 (two MPPT blocks), 302/303 (irradiance and temperatures), 123
  # (export limit) and vendor 64001.
  device-solar:
    <<: *sim
    command: ["python", "site/site.py"]
    environment:
      DEVICE_KIND: inverter
      DEVICE_ID: inv-solar-01
      DEVICE_MODEL: VECN SIM-INVERTER-3P
      MODBUS_PORT: "5020"
      HTTP_PORT: "8080"
      # This site's clock has drifted *ahead* by 4 s; the rural meter is 7 s behind. Skew in
      # both directions is what makes the dual-timestamp story visible rather than theoretical.
      DEVICE_CLOCK_SKEW_S: "4"
      # DC/AC = 5300/4200 = 1.26. The array is oversized against the inverter on purpose, so
      # the AC curve has a flat top around solar noon on a clear day: visible clipping.
      AC_RATING_KW: "4200"
      DC_RATING_KWP: "5300"
      EXPORT_LIMIT_KW: "4200"
      NOMINAL_VOLTAGE: "398"           # 690 V line-line / sqrt(3), a standard utility inverter
      ENERGY_BASE_KWH: "41800000"      # lifetime AC production before this session
      WORD_ORDER: low
      SIM_CLOCK_HOUR: "${SOLAR_CLOCK_HOUR:-}"
      # Real local time by default, so the irradiance curve is an honest one. Set
      # SOLAR_CLOCK_HOUR to a daytime hour for a demo that has to run at night:
      #   make up SOLAR_CLOCK_HOUR=12
    networks: [ot-solar]

  poller-solar:
    <<: *sim
    command: ["python", "poller/poller.py"]
    environment:
      DEVICE_KIND: inverter
      DEVICE_ID: inv-solar-01
      DEVICE_MODEL: VECN SIM-INVERTER-3P
      MODBUS_HOST: device-solar
      MODBUS_PORT: "5020"
      MODBUS_UNIT_ID: "1"
      OTLP_ENDPOINT: "http://edge-solar:4318"
      POLL_INTERVAL_MS: "1000"
      OTEL_METRIC_EXPORT_INTERVAL_MS: "5000"
      NOMINAL_VOLTAGE: "398"
      AC_RATING_KW: "4200"
      DC_RATING_KWP: "5300"
    depends_on: [device-solar, edge-solar]
    networks: [ot-solar]

  # ---- wind farm: utility-scale generation, third site (OT zone) ------------------
  # A deliberately different regime from solar (D17): six turbines with independent wind,
  # so per-machine output swings hard while the farm total stays comparatively steady. The
  # backhaul is fibre (10-20 ms), the opposite of the rural site's hostile 4G link, so the
  # same collector config is exercised on a good link as well as a bad one.
  edge-wind:
    <<: *collector
    user: "0:0"   # image runs as 10001, but the disk-backed queue is a root-owned volume
    environment:
      SITE_ID: wind-snowtown
      SITE_NAME: Snowtown Wind Farm
      SITE_KIND: wind_farm
      SITE_LAT: "-33.8167"
      SITE_LON: "138.2167"
      HUB_ENDPOINT: toxiproxy:14319
    volumes:
      - ../collector/edge/site.yaml:/etc/otel/config.yaml:ro
      - edge-wind-queue:/var/lib/otelcol/queue
    depends_on: [toxiproxy]
    networks: [ot-wind, wan]

  device-wind:
    <<: *sim
    command: ["python", "site/site.py"]
    environment:
      DEVICE_KIND: windfarm
      DEVICE_ID: wf-snowtown-01
      DEVICE_MODEL: VECN SIM-WIND-6X2.5MW
      MODBUS_PORT: "5020"
      HTTP_PORT: "8080"
      # Second-best clock of the four sites (the depot's comms room is better): a short fibre
      # backhaul means operators actually run NTP, so this one is only 2 s behind. Rural -7,
      # solar +4, wind -2, depot -1: skew in every direction, which is what makes the
      # dual-timestamp story a measurement not a claim.
      DEVICE_CLOCK_SKEW_S: "-2"
      TURBINE_COUNT: "6"
      RATED_KW_EACH: "2500"
      EXPORT_LIMIT_KW: "15000"
      NOMINAL_VOLTAGE: "398"
      ENERGY_BASE_KWH: "8050000"
      WORD_ORDER: low
    networks: [ot-wind]

  poller-wind:
    <<: *sim
    command: ["python", "poller/poller.py"]
    environment:
      DEVICE_KIND: windfarm
      DEVICE_ID: wf-snowtown-01
      DEVICE_MODEL: VECN SIM-WIND-6X2.5MW
      MODBUS_HOST: device-wind
      MODBUS_PORT: "5020"
      MODBUS_UNIT_ID: "1"
      OTLP_ENDPOINT: "http://edge-wind:4318"
      POLL_INTERVAL_MS: "1000"
      OTEL_METRIC_EXPORT_INTERVAL_MS: "5000"
      NOMINAL_VOLTAGE: "398"
    depends_on: [device-wind, edge-wind]
    networks: [ot-wind]

  # ---- metro depot: twelve bays, one charge point, a good link (M3-1) --------------
  # The site where two EVSE series become twelve. Everything here is the rural charging
  # site's block with different environment: same images, same poller, same edge config
  # (D10). What changes is the link (10-20 ms fibre, not a 4G backhaul) and the number of
  # bays - which is the point: the depot is the site that stresses cardinality, and D36
  # (EVSE metrics carry only EVSE-stable attributes) is what it has to survive.
  edge-metro:
    <<: *collector
    user: "0:0"   # image runs as 10001, but the disk-backed queue is a root-owned volume
    environment:
      SITE_ID: metro-tottenham
      SITE_NAME: Tottenham Metro Depot
      SITE_KIND: charging_site
      SITE_LAT: "-37.8016"
      SITE_LON: "144.8560"
      HUB_ENDPOINT: toxiproxy:14320
    volumes:
      - ../collector/edge/site.yaml:/etc/otel/config.yaml:ro
      - edge-metro-queue:/var/lib/otelcol/queue
    depends_on: [toxiproxy]
    networks: [ot-metro, wan]

  device-metro:
    <<: *sim
    command: ["python", "site/site.py"]
    environment:
      DEVICE_ID: meter-metro-01
      DEVICE_MODEL: VECN SIM-METER-3P-WYE
      MODBUS_PORT: "5020"
      HTTP_PORT: "8080"
      # A depot has a comms room and an NTP server, so its clock is nearly right: 1 s behind.
      # Clock skew is M3-4's demonstration, at the rural site where it is also plausible.
      DEVICE_CLOCK_SKEW_S: "-1"
      NOMINAL_VOLTAGE: "230"
      ENERGY_BASE_KWH: "128640.7"
      WORD_ORDER: low
    networks: [ot-metro]

  poller-metro:
    <<: *sim
    command: ["python", "poller/poller.py"]
    environment:
      DEVICE_ID: meter-metro-01
      DEVICE_MODEL: VECN SIM-METER-3P-WYE
      MODBUS_HOST: device-metro
      MODBUS_PORT: "5020"
      MODBUS_UNIT_ID: "1"
      OTLP_ENDPOINT: "http://edge-metro:4318"
      POLL_INTERVAL_MS: "1000"
      OTEL_METRIC_EXPORT_INTERVAL_MS: "5000"
      NOMINAL_VOLTAGE: "230"
    depends_on: [device-metro, edge-metro]
    networks: [ot-metro]

  # The CSMS is a test double and a central system in principle, but it lives in the site's
  # OT zone for the same reason the rural one does (D34, D10's budget). A second instance
  # rather than one shared CSMS keeps the two OT zones disjoint, which is the property the
  # whole repo is about; docs/standards.md says so out loud.
  csms-metro:
    <<: *sim
    command: ["python", "ocpp/csms.py"]
    environment:
      CSMS_PORT: "9000"
      HTTP_PORT: "9001"
      CSMS_ID: csms-metro-01
      OTLP_ENDPOINT: "http://edge-metro:4318"
      CSMS_BLOCKED_ID_TAGS: "BLOCKED-0000"
      CSMS_HEARTBEAT_INTERVAL_S: "60"
    depends_on: [edge-metro]
    networks: [ot-metro]

  ocpp-cp-metro:
    <<: *sim
    command: ["python", "ocpp/cp.py"]
    environment:
      CP_ID: EVSE-METRO-01
      CP_MODEL: VECN SIM-AC22
      # Twelve bays on ONE charge point: OCPP 1.6 is per-connector, so this is a legal shape
      # (a power cabinet with twelve outlets) and it keeps the concurrency in one process
      # where a crossed transactionId would be visible. Twelve separate charge points would
      # need twelve WebSockets and would hide the bug in the network instead.
      CP_EVSE_COUNT: "12"
      CSMS_URL: "ws://csms-metro:9000/ocpp/EVSE-METRO-01"
      HTTP_PORT: "8080"
      SUPPLY_MODBUS_HOST: device-metro
      SUPPLY_MODBUS_PORT: "5020"
      SUPPLY_MODBUS_UNIT_ID: "1"
      SUPPLY_POLL_INTERVAL_MS: "1000"
      OTLP_ENDPOINT: "http://edge-metro:4318"
      OTEL_METRIC_EXPORT_INTERVAL_MS: "5000"
      # Every bay runs a session, started 15 s apart: twelve concurrent transactions within
      # three minutes of `make up`, and ends staggered too because the duration is fixed.
      CP_AUTO_EVSE: "EVSE01,EVSE02,EVSE03,EVSE04,EVSE05,EVSE06,EVSE07,EVSE08,EVSE09,EVSE10,EVSE11,EVSE12"
      CP_AUTO_STAGGER_S: "15"
      CP_SESSION_DURATION_S: "600"
      CP_IDLE_GAP_S: "20"
      CP_METER_INTERVAL_S: "10"
    depends_on: [device-metro, csms-metro, edge-metro]
    networks: [ot-metro]

  # ---- isolated microgrid: solar + wind + BESS, no feeder at all (M3-2) ------------
  # The fifth site, and the one where a voltage sag means something different: there is no
  # upstream network to explain it. The site's signature is *frequency*, not voltage -
  # set by a grid-forming battery inverter instead of by the NEM (D17). One Modbus device,
  # one poller, one edge collector, in its own OT network with its own link: identical
  # images and identical edge config to the other four (D10, D16).
  #
  # No OCPP charge point here on purpose. The EV load that the grid former has to survive
  # is a *load* in the device's register file (LoadW/EVW), because a microgrid controller
  # sees chargers as load, not as a protocol peer. What a bay-level view of the microgrid
  # would add is already demonstrated at the rural site and the depot.
  edge-microgrid:
    <<: *collector
    user: "0:0"   # image runs as 10001, but the disk-backed queue is a root-owned volume
    environment:
      SITE_ID: microgrid-kangaroo-island
      SITE_NAME: Kangaroo Island Microgrid
      SITE_KIND: microgrid
      SITE_LAT: "-35.7750"
      SITE_LON: "137.2140"
      HUB_ENDPOINT: toxiproxy:14321
    volumes:
      - ../collector/edge/site.yaml:/etc/otel/config.yaml:ro
      - edge-microgrid-queue:/var/lib/otelcol/queue
    depends_on: [toxiproxy]
    networks: [ot-microgrid, wan]

  device-microgrid:
    <<: *sim
    command: ["python", "site/site.py"]
    environment:
      DEVICE_KIND: microgrid
      DEVICE_ID: mg-kangaroo-island-01
      DEVICE_MODEL: VECN SIM-MICROGRID-1
      MODBUS_PORT: "5020"
      HTTP_PORT: "8080"
      # An islanded site far from any time source: the worst clock of the five, 11 s behind.
      # That is also why the clock-skew demonstration (M3-4) uses this site - a device clock
      # that is wrong by tens of seconds is ordinary here, and a backend must not "fix" it.
      DEVICE_CLOCK_SKEW_S: "-11"
      NOMINAL_VOLTAGE: "230"
      NOMINAL_HZ: "50"
      # The island: 350 kWp of PV, one 300 kW turbine, a 300 kW / 500 kWh battery, and a site
      # load that steps by 300 kW every four minutes when the EV block starts. Those numbers
      # are chosen so the battery is sometimes at its limit and sometimes not - a BESS that
      # never reaches a limit demonstrates nothing.
      PV_KWP: "350"
      WIND_RATED_KW: "300"
      BESS_KWH: "500"
      BESS_MAX_CHARGE_KW: "300"
      BESS_MAX_DISCHARGE_KW: "300"
      BESS_SOC_INIT_PCT: "72"
      LOAD_BASE_KW: "150"
      EV_STEP_KW: "300"
      EV_CYCLE_S: "240"
      EV_ON_S: "90"
      # 1.5 MVA system base and 2 s of inertia: an inverter-dominated island with almost no
      # rotating mass, which is why its frequency moves where the NEM's does not.
      SYSTEM_BASE_KW: "1500"
      INERTIA_H: "2"
      DROOP_R: "0.02"
      SOC_MIN_PCT: "12"
      SOC_MAX_PCT: "98"
      SHED_HZ: "49.4"
      CURTAIL_HZ: "50.35"
      SIM_CLOCK_HOUR: "${SOLAR_CLOCK_HOUR:-}"
    networks: [ot-microgrid]

  poller-microgrid:
    <<: *sim
    command: ["python", "poller/poller.py"]
    environment:
      DEVICE_KIND: microgrid
      DEVICE_ID: mg-kangaroo-island-01
      DEVICE_MODEL: VECN SIM-MICROGRID-1
      MODBUS_HOST: device-microgrid
      MODBUS_PORT: "5020"
      MODBUS_UNIT_ID: "1"
      OTLP_ENDPOINT: "http://edge-microgrid:4318"
      POLL_INTERVAL_MS: "1000"
      OTEL_METRIC_EXPORT_INTERVAL_MS: "5000"
      NOMINAL_VOLTAGE: "230"
    depends_on: [device-microgrid, edge-microgrid]
    networks: [ot-microgrid]

  # ---- highway hub: six bays, a site capacity cap (M4, #12) --------------------------
  # A motorway service centre: more bays than power. The site's 100 kW supply cannot feed six
  # 22 kW bays at once, so the CSMS pushes a `ChargePointMaxProfile` (an OCPP 1.6 site cap) and
  # the charge point shares it equally between the bays that are actually charging.
  #
  # Why this site exists: every other site here is unconstrained. This is the one where the
  # interesting OT question - "what happens to a queue of vehicles when there is more demand than
  # supply" - is answerable, and where a load-management decision is visible as telemetry rather
  # than as a chart somebody drew.
  #
  # No new architecture (D16): the same image, the same poller, the same edge config as the other
  # five sites; the difference is the capacity cap and six bays.
  edge-highway:
    <<: *collector
    user: "0:0"   # image runs as 10001, but the disk-backed queue is a root-owned volume
    environment:
      SITE_ID: highway-hume
      SITE_NAME: Hume Highway Service Centre
      SITE_KIND: charging_site
      SITE_LAT: "-35.1500"
      SITE_LON: "147.4500"
      HUB_ENDPOINT: toxiproxy:14322
    volumes:
      - ../collector/edge/site.yaml:/etc/otel/config.yaml:ro
      - edge-highway-queue:/var/lib/otelcol/queue
    depends_on: [toxiproxy]
    networks: [ot-highway, wan]

  device-highway:
    <<: *sim
    command: ["python", "site/site.py"]
    environment:
      DEVICE_ID: meter-highway-01
      DEVICE_MODEL: VECN SIM-METER-3P-WYE
      MODBUS_PORT: "5020"
      HTTP_PORT: "8080"
      DEVICE_CLOCK_SKEW_S: "-4"
      NOMINAL_VOLTAGE: "230"
      ENERGY_BASE_KWH: "58210.6"
      WORD_ORDER: low
    networks: [ot-highway]

  poller-highway:
    <<: *sim
    command: ["python", "poller/poller.py"]
    environment:
      DEVICE_ID: meter-highway-01
      DEVICE_MODEL: VECN SIM-METER-3P-WYE
      MODBUS_HOST: device-highway
      MODBUS_PORT: "5020"
      MODBUS_UNIT_ID: "1"
      OTLP_ENDPOINT: "http://edge-highway:4318"
      POLL_INTERVAL_MS: "1000"
      OTEL_METRIC_EXPORT_INTERVAL_MS: "5000"
      NOMINAL_VOLTAGE: "230"
    depends_on: [device-highway, edge-highway]
    networks: [ot-highway]

  csms-highway:
    <<: *sim
    command: ["python", "ocpp/csms.py"]
    environment:
      CSMS_PORT: "9000"
      HTTP_PORT: "9001"
      CSMS_ID: csms-highway-01
      OTLP_ENDPOINT: "http://edge-highway:4318"
      CSMS_BLOCKED_ID_TAGS: "BLOCKED-0000"
      CSMS_HEARTBEAT_INTERVAL_S: "60"
    depends_on: [edge-highway]
    networks: [ot-highway]

  ocpp-cp-highway:
    <<: *sim
    command: ["python", "ocpp/cp.py"]
    environment:
      CP_ID: EVSE-HIGHWAY-01
      CP_MODEL: VECN SIM-AC22
      # Six bays on one charge point, which is what a service centre's power cabinet looks like.
      CP_EVSE_COUNT: "6"
      CSMS_URL: "ws://csms-highway:9000/ocpp/EVSE-HIGHWAY-01"
      HTTP_PORT: "8080"
      SUPPLY_MODBUS_HOST: device-highway
      SUPPLY_MODBUS_PORT: "5020"
      SUPPLY_MODBUS_UNIT_ID: "1"
      SUPPLY_POLL_INTERVAL_MS: "1000"
      OTLP_ENDPOINT: "http://edge-highway:4318"
      OTEL_METRIC_EXPORT_INTERVAL_MS: "5000"
      # Six bays, staggered 10 s apart, all wanting 22 kW each: 132 kW of demand against a 100 kW
      # supply, which is the whole point of the site.
      CP_AUTO_EVSE: "EVSE01,EVSE02,EVSE03,EVSE04,EVSE05,EVSE06"
      CP_AUTO_STAGGER_S: "10"
      CP_SESSION_DURATION_S: "900"
      CP_IDLE_GAP_S: "20"
      CP_METER_INTERVAL_S: "10"
    depends_on: [device-highway, csms-highway, edge-highway]
    networks: [ot-highway]
